[project]
name = "apex-diligence"
version = "0.1.0"
description = "AI-driven financial due diligence engine for Apex Electronics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "python-docx>=1.1",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apex_diligence*", "app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
